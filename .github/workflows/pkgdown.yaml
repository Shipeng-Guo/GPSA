# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow is configured for MANUAL triggering only.
# The pkgdown site should be built locally (where the HDF5 database exists)
# and then deployed using: pkgdown::deploy_to_branch()
#
# This prevents CI from overwriting the site with non-executable vignettes.

on:
  # Manual trigger only - prevents auto-overwrite of gh-pages
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to gh-pages (requires HDF5 database in CI, typically false)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install system dependencies for rhdf5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # Install Bioconductor packages separately (rhdf5)
      - name: Install Bioconductor dependencies
        run: |
          if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager")
          BiocManager::install("rhdf5", ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Only deploy if explicitly requested AND workflow was manually triggered
      - name: Deploy to GitHub pages
        if: github.event.inputs.deploy == 'true'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
